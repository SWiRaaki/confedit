<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benutzer & Rechte - Konfigurationseditor</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/errors.js"></script>
    <script src="js/service.js"></script>
    <script src="js/app.js"></script>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="main.html">Datei</a></li>
                <li><a href="versionen.html">Versionen</a></li>
                <li><a href="benutzer.html" class="active">Benutzer</a></li>
                <li><a href="hilfe.html">Hilfe</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="card">
            <div class="card-header">
                <h1 class="mb-0">Benutzer & Rechte</h1>
            </div>
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="mb-0">Benutzerverwaltung</h2>
                    <button type="button" id="add-user" class="btn btn-success">➕ Neuen Benutzer hinzufügen</button>
                </div>

                <div class="table-responsive">
                    <table id="user-table" class="table">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Abkürzung</th>
                                <th>Gruppen</th>
                                <th class="text-center">Aktionen</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Users will be loaded dynamically -->
                        </tbody>
                    </table>
                </div>

                <section class="card mt-4">
                    <div class="card-header">
                        <h2 class="mb-0">Gruppen</h2>
                    </div>
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h3 class="mb-0">Verfügbare Gruppen</h3>
                            <button type="button" id="add-group" class="btn btn-primary">➕ Neue Gruppe</button>
                        </div>
                        <div class="table-responsive">
                            <table id="group-table" class="table">
                                <thead>
                                    <tr>
                                        <th>Name</th>
                                        <th>Abkürzung</th>
                                        <th>Beschreibung</th>
                                        <th class="text-center">Aktionen</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <!-- Groups will be loaded dynamically -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </section>
            </div>
        </section>
    </main>
</body>
</html>
